<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Crypto Lab Quest</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff1b8;--ink:#2b2350;--card:#fff;--ok:#2ecc71;--bad:#ff4d6d;--pop:#7c4dff;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1f55;--ink:#fff7d6;--card:#3b2d7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a1f55;--ink:#fff7d6;--card:#3b2d7a;color-scheme:dark}
*{box-sizing:border-box}html,body{height:auto;margin:0}
body{font-family:Fredoka,"Trebuchet MS",sans-serif;background:var(--bg);color:var(--ink);background-image:radial-gradient(#ffb70344 3px,transparent 3px);background-size:34px 34px;min-height:100vh}
#app{max-width:860px;margin:auto;padding:16px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:18px;margin:14px 0;animation:pop .4s}
.btn{font:700 18px Fredoka,sans-serif;background:var(--c,var(--pop));color:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:10px 20px;cursor:pointer;margin:6px 6px 6px 0;transition:.1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}.btn.alt{background:#ffd23f;color:#2b2350}
h1,h2{margin:.2em 0}h1{font-size:34px}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.pill{background:#ffd23f;color:#2b2350;border:3px solid var(--ink);border-radius:99px;padding:2px 14px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.node{background:var(--c);color:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:14px;cursor:pointer;text-align:center;transition:.15s;animation:pop .5s backwards}
.node:hover{transform:translateY(-6px) rotate(-2deg)}.node .em{font-size:44px;display:block}
.node.lock{filter:grayscale(1);opacity:.6;cursor:not-allowed}
.mascot{display:flex;gap:12px;align-items:center}.mascot .m{font-size:58px;animation:bob 1.6s infinite}
.bubble{background:#fff;color:#2b2350;border:3px solid var(--ink);border-radius:18px;padding:8px 14px;font-weight:500}
.code{background:#1e1b3a;color:#fff;border-radius:16px;border:3px solid var(--ink);padding:12px;font:500 15px "JetBrains Mono",monospace;overflow-x:auto}
.ln{padding:2px 0;white-space:pre-wrap;word-break:break-all;color:#8b84c9}.ln.done{color:#5ef2a0}.ln.cur{color:#ffd23f;background:#ffffff14;border-radius:6px}
.ln.cur span.ok{color:#5ef2a0}.ln.cur span.bad{color:#fff;background:var(--bad);border-radius:3px}
.ln.hid,.ln.cur.blur{filter:blur(6px)}
.hint{background:#e3f2ff;color:#2b2350;border:3px dashed #3d8bff;border-radius:14px;padding:8px 12px;margin:10px 0;font-weight:500}
input.t{width:100%;font:700 16px "JetBrains Mono",monospace;padding:12px;border-radius:14px;border:3px solid var(--ink);background:#fff;color:#2b2350}
.prog{height:14px;background:#0002;border-radius:9px;overflow:hidden;border:2px solid var(--ink)}.prog i{display:block;height:100%;background:var(--c);transition:.3s}
.opt{display:block;width:100%;text-align:left;margin:8px 0;background:#fff;color:#2b2350}.opt.ok{background:var(--ok);color:#fff;animation:pop .4s}.opt.no{background:var(--bad);color:#fff;animation:shake .4s}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{flex:1;min-width:90px;text-align:center;background:#ffd23f;color:#2b2350;border:3px solid var(--ink);border-radius:16px;padding:8px;font-weight:700;font-size:22px}.stat small{display:block;font-size:12px}
ul{padding-left:20px;line-height:1.6}li b{color:var(--c)}
.conf{position:fixed;top:-40px;font-size:28px;animation:fall 2.4s linear forwards;pointer-events:none;z-index:9}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bob{50%{transform:translateY(-10px) rotate(6deg)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.bub{position:fixed;right:14px;top:96px;max-width:260px;background:#fff;color:#2b2350;border:3px solid var(--ink);border-radius:20px 20px 4px 20px;box-shadow:0 5px 0 var(--ink);padding:10px 14px;font-weight:500;z-index:8;animation:pop .35s}.bub b{display:block;color:#7c4dff}
.term{background:#0d0b1f;color:#5ef2a0;border:3px solid var(--ink);border-radius:16px;padding:12px;font:500 14px "JetBrains Mono",monospace;white-space:pre-wrap;word-break:break-all;margin:10px 0}.term small{display:block;color:#8b84c9}
.wm{position:fixed;left:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:#ffd23f;color:#2b2350;border:2px solid var(--ink);border-radius:99px;padding:2px 12px;font-weight:700;font-size:13px;z-index:7}
.inbar{position:sticky;bottom:calc(40px + env(safe-area-inset-bottom,0px));background:var(--card);padding:6px 0;z-index:5}
@media(max-width:600px){#app{padding:10px 10px 64px}h1{font-size:26px}.card{padding:12px;border-radius:18px}.btn{font-size:16px;padding:9px 14px}.code{font-size:13px;padding:8px}.bub{top:auto;bottom:calc(130px + env(safe-area-inset-bottom,0px));left:10px;right:10px;max-width:none}.mascot .m{font-size:42px}.grid{grid-template-columns:1fr 1fr;gap:10px}.node .em{font-size:34px}}
</style></head><body><div id="app"></div><div class="wm">Made by Anjal</div>
<script>
const T=[
{n:"Hash",em:"🧮",c:"#ff6b6b",story:"A hash turns any text into a number fingerprint. Ours is the baby version: add up every letter’s ASCII code.",pts:["<b>H</b> = 72, <b>e</b> = 101 … “Hello” adds up to <b>500</b>.","The loop stops at <b>'\\0'</b>, the invisible end-of-string mark."],
code:String.raw`#include <stdio.h> ## Header for printf and scanf.
int main() {
  int h = 0, i; ## h is the hash. It starts at 0.
  char s[100];
  scanf("%s", s); ## Read one word from the keyboard.
  for (i = 0; s[i] != '\0'; i++) ## Walk until the string ends.
    h += s[i]; ## Add each ASCII value to the hash.
  printf("Hash %d\n", h); ## Print the fingerprint.
  return 0;
}`,q:[["What does this hash add up?",["ASCII values of every character","Number of words","Only the length"],0,"Each char is a number (H = 72). “Hello” gives 500."],["Why is a sum-of-ASCII hash weak?",["Different strings can give the same hash","It is too slow","It needs a key"],0,"“ab” and “ba” collide. Real hashes like SHA-256 avoid this."]]},
{n:"Substitution",em:"🔤",c:"#ff9f1c",story:"Shuffle the alphabet and use it as a secret decoder ring. Each plain letter swaps with the key letter in the same position.",pts:["Plain: <b>abc…z</b>. Key: <b>qwerty…</b> (a shuffled copy).","“hello” becomes <b>itssg</b>. Decrypt by swapping the two alphabets."],
code:String.raw`#include <stdio.h>
int main() {
  char p[] = "abcdefghijklmnopqrstuvwxyz"; ## Plain alphabet.
  char k[] = "qwertyuiopasdfghjklzxcvbnm"; ## Key = shuffled alphabet.
  char m[] = "hello"; ## The message.
  int i, j;
  for (i = 0; m[i]; i++) ## Go through each message letter.
    for (j = 0; j < 26; j++) ## Search it in the plain alphabet.
      if (m[i] == p[j]) { m[i] = k[j]; break; } ## Swap with key letter, then stop searching.
  printf("%s\n", m); ## Prints itssg.
  return 0;
}`,q:[["The key of a substitution cipher is…",["A shuffled alphabet","One number from 1 to 25","A prime number"],0,"Each plain letter maps to the key letter at the same position."],["How do you decrypt?",["Find the letter in the key alphabet, take the same position in the plain alphabet","Add 3 to each letter","Use a private key"],0,"Same code, roles of p and k swapped."]]},
{n:"RSA",em:"🔐",c:"#2ec4b6",story:"RSA locks with a public key and opens with a private key. It works because multiplying primes is easy but un-multiplying is hard.",pts:["p = 11, q = 17 → <b>n = 187</b>, <b>φ = 160</b>.","Public <b>(7, 187)</b>, private <b>(23, 187)</b>. Message 88 → <b>11</b> → 88."],
code:String.raw`#include <stdio.h>
int main() {
  int p = 11, q = 17; ## Two small primes.
  int n = p * q, phi = (p-1) * (q-1); ## n = 187, phi = 160.
  int e = 7, d = 1, m = 88, c = 1, r = 1, i; ## e is public. m is the message.
  while ((e * d) % phi != 1) d++; ## Find d so that e*d mod phi is 1.
  for (i = 0; i < e; i++) c = (c * m) % n; ## Encrypt: c = m^e mod n.
  for (i = 0; i < d; i++) r = (r * c) % n; ## Decrypt: r = c^d mod n.
  printf("%d %d\n", c, r); ## Prints 11 88.
  return 0;
}`,q:[["With p = 11 and q = 17, what is n?",["187","160","28"],0,"n = p × q = 187. φ = 10 × 16 = 160."],["Which key encrypts in RSA?",["Public (e, n)","Private (d, n)","Neither"],0,"Encrypt with C = mᵉ mod n. Decrypt with M = Cᵈ mod n."]]},
{n:"Diffie-Hellman",em:"🤝",c:"#3d8bff",story:"Alice and Bob create the same secret while shouting across a crowded room. Only public values travel. Private keys stay home.",pts:["Public: <b>A = gᵃ mod p</b>, <b>B = gᵇ mod p</b>.","Secret: <b>Bᵃ = Aᵇ = gᵃᵇ mod p</b>. Both get 160."],
code:String.raw`#include <stdio.h>
int power(int b, int e, int p) { ## Helper: b^e mod p.
  int r = 1, i;
  for (i = 0; i < e; i++) r = (r * b) % p; ## Multiply e times, keep it small with mod.
  return r;
}
int main() {
  int p = 353, g = 3, a = 97, b = 233; ## Prime, root, Alice’s and Bob’s secrets.
  int A = power(g, a, p), B = power(g, b, p); ## Public keys to exchange.
  printf("%d %d\n", power(B, a, p), power(A, b, p)); ## Alice and Bob both print 160.
  return 0;
}`,q:[["What travels over the open network?",["Public keys A and B","Private keys a and b","The shared secret"],0,"Only A and B are sent. a and b never leave their owners."],["Why do both sides get the same secret?",["(gᵃ)ᵇ = (gᵇ)ᵃ mod p","They pick the same private key","A server tells them"],0,"Exponents commute, so both end at gᵃᵇ mod p."]]},
{n:"DES",em:"🧱",c:"#9b5de5",story:"DES chops data into 8-byte blocks and scrambles each through 16 rounds using one shared key. Same key and reversed rounds unscramble it.",pts:["Block <b>64 bits</b>, key <b>56 effective bits</b>, <b>16 rounds</b>.","OpenSSL does the rounds. You set the key, then call <b>DES_ecb_encrypt</b>."],
code:String.raw`#include <stdio.h>
#include <openssl/des.h>
int main() {
  DES_cblock key = "mykey123"; ## 8-byte secret key.
  DES_key_schedule ks; ## Holds the 16 round subkeys.
  unsigned char in[8] = "crypto!", out[8], back[8]; ## Plain, cipher and decrypted blocks.
  int i;
  DES_set_key_unchecked(&key, &ks); ## Build the key schedule.
  DES_ecb_encrypt((DES_cblock*)in, (DES_cblock*)out, &ks, DES_ENCRYPT); ## Encrypt in to out.
  DES_ecb_encrypt((DES_cblock*)out, (DES_cblock*)back, &ks, DES_DECRYPT); ## Decrypt out to back.
  for (i = 0; i < 8; i++) printf("%02x", out[i]); ## Cipher bytes in hex.
  printf("\n%s\n", back); ## Prints crypto!
  return 0;
}`,q:[["DES block size and key?",["64-bit block, 56 effective key bits","128-bit block, 128-bit key","8-bit block, 8-bit key"],0,"The 8-byte key has 8 parity bits, leaving 56 real bits."],["How many rounds does DES have?",["16","10","8"],0,"16 Feistel rounds. Decryption uses the subkeys in reverse."]]},
{n:"Digital Signature",em:"✍️",c:"#f15bb5",story:"A digital signature proves who wrote a message. Sign with your private key, and anyone can check it with your public key.",pts:["Algorithm <b>SHA256withDSA</b>, 1024-bit key.","Flow: <b>generate keys → sign → verify</b>. Prints true."],
code:String.raw`import java.security.*; ## Java crypto package.
public class Dsa {
  public static void main(String[] x) throws Exception {
    KeyPairGenerator g = KeyPairGenerator.getInstance("DSA"); ## Key factory.
    g.initialize(1024); ## Key size.
    KeyPair kp = g.generateKeyPair(); ## Public + private key.
    Signature s = Signature.getInstance("SHA256withDSA"); ## Signer.
    s.initSign(kp.getPrivate()); ## Sign with the private key.
    s.update("Hello".getBytes()); ## Feed the message.
    byte[] sig = s.sign(); ## The signature.
    s.initVerify(kp.getPublic()); ## Verify with the public key.
    s.update("Hello".getBytes()); ## Same message again.
    System.out.println(s.verify(sig)); ## Prints true.
  }
}`,q:[["You sign with…",["Your private key","Your public key","A shared secret"],0,"Sign with private. Anyone verifies with public."],["verify() gives true when…",["Message and signature match the public key","The message is encrypted","The key is 1024 bits"],0,"Change one letter of the message and it becomes false."]]},
{n:"LSB Stego",em:"🕵️",c:"#00b86b",story:"Hide a secret inside a picture! Change only the last bit of each pixel byte. The eye cannot notice, but the bits spell your message.",pts:["BMP header is <b>54 bytes</b>. Skip it, never edit it.","<b>(p &amp; 254)</b> clears the last bit. <b>| bit</b> puts ours in. 8 chars = 64 bytes."],
code:String.raw`#include <stdio.h>
int main() {
  FILE *in = fopen("input.bmp", "rb"), *out = fopen("stego.bmp", "wb"); ## Open the images.
  char m[9] = "HELLO123"; ## Secret, 8 chars.
  int i, j, p;
  for (i = 0; i < 54; i++) fputc(fgetc(in), out); ## Copy the 54-byte header untouched.
  for (i = 0; i < 8; i++) ## Each character...
    for (j = 7; j >= 0; j--) { ## ...each bit, left to right.
      p = fgetc(in); ## Read one pixel byte.
      fputc((p & 254) | ((m[i] >> j) & 1), out); ## Replace its last bit with our bit.
    }
  while ((p = fgetc(in)) != EOF) fputc(p, out); ## Copy the rest of the image.
  fclose(in); fclose(out);
  in = fopen("stego.bmp", "rb"); ## Now extract.
  fseek(in, 54, SEEK_SET); ## Jump past the header.
  for (i = 0; i < 8; i++) { m[i] = 0;
    for (j = 7; j >= 0; j--) m[i] |= (fgetc(in) & 1) << j; ## Rebuild each char from last bits.
  }
  printf("%s\n", m); ## Prints HELLO123.
  return 0;
}`,q:[["Why skip the first 54 bytes?",["It is the header, not pixels","It stores the message","It is padding"],0,"Editing the header would corrupt the image."],["What does (p & 254) do?",["Clears the last bit so ours fits","Sets all bits to 1","Reverses the bits"],0,"254 = 11111110. AND wipes the LSB. OR then writes the message bit."]]}
];
const app=document.getElementById("app"),$=s=>document.querySelector(s);
const hs=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0),0),pw=(b,e,p)=>{let r=1;for(let i=0;i<e;i++)r=r*b%p;return r};
const C=(c,cmd,f)=>{T[c].cmd=cmd;T[c].run=f};
C(0,"./hash",()=>"Hash "+hs("Hello"));
C(1,"./subst",()=>{const p="abcdefghijklmnopqrstuvwxyz",k="qwertyuiopasdfghjklzxcvbnm";return [..."hello"].map(c=>k[p.indexOf(c)]).join("")});
C(2,"./rsa",()=>{const n=187,phi=160,e=7,m=88;let d=1;while(e*d%phi!=1)d++;const c=pw(m,e,n);return c+" "+pw(c,d,n)});
C(3,"./dh",()=>pw(pw(3,233,353),97,353)+" "+pw(pw(3,97,353),233,353));
C(4,"./des   (gcc des.c -lcrypto)",()=>"6983c03b33556e01\ncrypto!");
C(5,"java Dsa",()=>"true");
C(6,"./stego",()=>{const px=Array.from({length:64},()=>Math.random()*256|0),m="HELLO123",s=px.map((p,k)=>(p&254)|((m.charCodeAt(k>>3)>>(7-k%8))&1));let o="";for(let i=0;i<8;i++){let c=0;for(let j=0;j<8;j++)c|=(s[i*8+j]&1)<<(7-j);o+=String.fromCharCode(c)}return o});
function run(){$("#out").innerHTML=`<div class="term"><small>$ ${esc(T[t].cmd)}</small>${esc(T[t].run())}<small>▲ Simulated in your browser. Same maths as your program.</small></div>`}
function bub(h){if(!h)return;document.querySelectorAll(".bub").forEach(e=>e.remove());const e=document.createElement("div");e.className="bub";e.innerHTML="<b>🐙 Explained</b>"+esc(h);document.body.appendChild(e);setTimeout(()=>e.remove(),4500)}
const nz=s=>s.replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/\s+/g,"");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const say=["Let’s crack it! 🔥","You’re a code wizard!","Fingers ready? ⌨️","Tiny steps, big skills!","Exam? Easy peasy!"];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
let P={xp:0};try{P=Object.assign(P,JSON.parse(localStorage.getItem("cq")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("cq",JSON.stringify(P))}catch(e){}};
let r=1,t=0,L,li,err,peeks,t0,tot,pk,prev,qi,sc;
const st=(R,i)=>P["s"+R+i]||0,star=n=>"⭐".repeat(n)||"☆☆☆";
const unlocked=()=>T.every((_,i)=>st(1,i)>0);
const mas=(m)=>`<div class="mascot"><span class="m">🐙</span><div class="bubble">${m}</div></div>`;
const hdr=()=>`<div class="bar"><button class="btn alt" onclick="map()">🗺️ Map</button><span class="pill">Round ${r}${r==2?" · Memory mode":""}</span><span class="pill">⚡ ${P.xp} XP</span></div>`;
function map(){
  app.innerHTML=`<h1>🐙 Crypto Lab Quest</h1>${mas(rnd(say))}
  <div class="bar"><div><button class="btn ${r==1?"":"alt"}" onclick="r=1;map()">Round 1 · Learn</button><button class="btn ${r==2?"":"alt"}" onclick="${unlocked()?"r=2;map()":"alert('Finish Round 1 first!')"}">${unlocked()?"":"🔒 "}Round 2 · Memorize</button></div><span class="pill">⚡ ${P.xp} XP</span></div>
  <div class="grid">${T.map((x,i)=>`<div class="node ${r==2&&!unlocked()?"lock":""}" style="--c:${x.c};animation-delay:${i*.06}s" onclick="go(${i})"><span class="em">${x.em}</span><b>${i+1}. ${x.n}</b><div>${star(st(r,i))}</div></div>`).join("")}</div>`;
}
function go(i){t=i;r==2?typ():learn()}
function learn(){const x=T[t];
  app.innerHTML=`${hdr()}<div class="card" style="--c:${x.c}"><h2>${x.em} ${x.n}</h2>${mas(x.story)}<ul>${x.pts.map(p=>`<li>${p}</li>`).join("")}</ul><button class="btn" onclick="typ()">Type it! ⌨️</button></div>`}
function typ(){const x=T[t];
  L=x.code.split("\n").map(l=>{const[c,h]=l.split(" ## ");return{ind:c.search(/\S/),c:c.trim(),h:h||""}});
  li=0;err=0;peeks=0;t0=0;pk=false;prev=0;tot=L.reduce((a,l)=>a+l.c.length,0);
  app.innerHTML=`${hdr()}<div class="card" style="--c:${x.c}"><div class="bar"><h2>${x.em} ${x.n}</h2><span id="cnt" class="pill"></span></div><div class="prog"><i id="pg"></i></div><div id="code" class="code" style="margin-top:10px"></div><div id="hint" class="hint"></div>
  <div class="inbar"><input id="inp" class="t" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type the glowing line (spaces optional)"></div>
  ${r==2?`<button class="btn alt" onclick="pk=true;peeks++;paint()">👀 Peek (−4%)</button>`:""}</div>`;
  $("#code").onclick=()=>$("#inp").focus();$("#inp").oninput=inp;paint();$("#inp").focus()}
function paint(){const l0=L[li];let h="";
  L.forEach((l,i)=>{const s=`style="padding-left:${l.ind*9}px"`;
    h+=i<li?`<div class="ln done" ${s}>${esc(l.c)}</div>`:i==li?`<div class="ln cur ${r==2&&!pk?"blur":""}" ${s}>${[...l.c].map(c=>`<span>${esc(c)}</span>`).join("")}</div>`:`<div class="ln ${r==2?"hid":""}" ${s}>${esc(l.c)}</div>`});
  $("#code").innerHTML=h;let hh="";for(let i=li;i>=0&&!hh;i--)hh=L[i].h;
  $("#hint").innerHTML="💡 "+esc(hh||"Type line by line. It moves on by itself.");
  $("#pg").style.width=(100*li/L.length)+"%";$("#pg").style.background=T[t].c;$("#cnt").textContent=`Line ${li+1}/${L.length}`}
function inp(){const l=L[li],v=nz($("#inp").value),w=nz(l.c);let k=0;
  document.querySelectorAll(".cur span").forEach((s,i)=>{if(/\s/.test(l.c[i])){s.className=k<=v.length?"ok":"";return}s.className=k<v.length?(v[k]==w[k]?"ok":"bad"):"";k++});
  if(v.length>prev&&v[v.length-1]!=w[v.length-1])err++;prev=v.length;
  if(v===w){bub(l.h);li++;prev=0;pk=false;$("#inp").value="";li>=L.length?fin():paint()}}
function fin(){const acc=Math.round(100*tot/(tot+err)),s=acc-peeks*4,n=s>=95?3:s>=85?2:1;
  P["s"+r+t]=Math.max(st(r,t),n);P.xp+=n*10;save();boom();
  app.innerHTML=`${hdr()}<div class="card"><h2>🎉 Nailed it!</h2><div class="stats"><div class="stat">${err}<small>Mistakes</small></div><div class="stat">${acc}%<small>Accuracy</small></div><div class="stat">${star(n)}<small>Stars</small></div></div>
  <p>${n==3?"Flawless! Run it, then take the viva.":"Retry for 3 stars, or run it and go to the viva."}</p><div id="out"></div><button class="btn" style="--c:#00b86b" onclick="run()">▶ Run program</button><button class="btn" onclick="quiz()">Viva quiz 🎤</button><button class="btn alt" onclick="typ()">Try again 🔁</button></div>`}
function quiz(){qi=0;sc=0;q()}
function q(){const x=T[t],Q=x.q[qi];
  app.innerHTML=`${hdr()}<div class="card" style="--c:${x.c}"><span class="pill">Viva ${qi+1}/${x.q.length}</span><h2>${Q[0]}</h2><div id="o">${Q[1].map((o,i)=>`<button class="btn opt" onclick="pick(${i})">${o}</button>`).join("")}</div><div id="ex"></div></div>`}
function pick(i){const x=T[t],Q=x.q[qi],b=document.querySelectorAll(".opt");
  b.forEach((e,k)=>{e.disabled=true;if(k==Q[2])e.classList.add("ok");else if(k==i)e.classList.add("no")});
  if(i==Q[2]){sc++;P.xp+=5;save()}
  $("#ex").innerHTML=`<div class="hint">${i==Q[2]?"✅ Correct! ":"❌ Not quite. "}${Q[3]}</div><button class="btn" onclick="${qi+1<x.q.length?"qi++;q()":"done()"}">Next ➡️</button>`}
function done(){boom();const nx=t+1<T.length;
  app.innerHTML=`${hdr()}<div class="card"><h2>🏆 ${T[t].n} complete!</h2>${mas(rnd(say))}<p>Viva score: ${sc}/${T[t].q.length}. Total ${P.xp} XP.</p>
  ${nx?`<button class="btn" onclick="go(${t+1})">Next: ${T[t+1].em} ${T[t+1].n}</button>`:`<p>🎓 All 7 done! ${r==1?"Round 2 (Memory mode) is open. The code is hidden now, so recall it from the hints.":"You’re exam ready!"}</p>`}<button class="btn alt" onclick="map()">Back to map</button></div>`}
function boom(){for(let i=0;i<26;i++){const e=document.createElement("span");e.className="conf";e.textContent=rnd(["🎉","⭐","✨","🔐","💥"]);e.style.left=Math.random()*100+"vw";e.style.animationDelay=Math.random()*.6+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}}
map();
</script></body></html>
