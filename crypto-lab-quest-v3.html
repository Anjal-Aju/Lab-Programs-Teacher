code:String.raw`#include <stdio.h>
int gcd(int a, int b)
{
  while (b != 0) ## Euclid’s method.
  {
    int temp = b;
    b = a % b;
    a = temp;
  }
  return a;
}
int main()
{
  int p, q, n, phi, e, d = 1, m, c = 1, r = 1, i;
  printf("Enter two primes p and q : ");
  scanf("%d %d", &p, &q);
  n = p * q; ## n is part of both keys.
  phi = (p - 1) * (q - 1); ## Euler’s totient of n.
  for (e = 7; e < phi; e++) ## Try e = 7, 8, 9 …
    if (gcd(e, phi) == 1) ## e must share no factor with phi.
      break;
  while ((e * d) % phi != 1) ## Find the inverse of e.
    d++;
  printf("Public key : (%d,%d)\n", e, n);
  printf("Private key : (%d,%d)\n", d, n);
  printf("Enter message (< %d) : ", n);
  scanf("%d", &m);
  for (i = 0; i < e; i++)
    c = (c * m) % n; ## Encrypt: c = m^e mod n.
  printf("Encrypted : %d\n", c);
  for (i = 0; i < d; i++)
    r = (r * c) % n; ## Decrypt: r = c^d mod n.
  printf("Decrypted : %d\n", r);
  return 0;
}`,

code:String.raw`#include <stdio.h>
int power(int base, int exp, int mod) ## Helper that returns base^exp mod mod.
{
  int result = 1, i;
  for (i = 0; i < exp; i++)
  {
    result = (result * base) % mod; ## Multiply, then shrink with mod.
  }
  return result;
}
int main()
{

  scanf("%d", &a);
  printf("Enter Bob's private key : ");

  S2 = power(A, b, p); ## Bob’s secret.

}`,

algo:["Read an 8-character plaintext and an 8-character key.","Make 16 subkeys from the key.","Split the 64-bit block into left L and right R halves.","Repeat 16 rounds: new R = L XOR F(R, subkey), new L = old R.","Swap L and R. This is the ciphertext; print it in hex.","Decrypt by running the same rounds with the subkeys reversed.","Print the decrypted text."],
code:String.raw`#include <stdio.h>
#include <string.h>
unsigned int F(unsigned int r, unsigned int k) ## Round function: rotate left 5 bits, XOR the subkey.
{
  return ((r << 5) | (r >> 27)) ^ k;
}
void crypt8(unsigned int *L, unsigned int *R, unsigned int k[], int dec) ## dec = 1 means decrypt.
{
  unsigned int t;
  int i;
  for (i = 0; i < 16; i++) ## 16 Feistel rounds.
  {
    t = *R; ## Remember the old right half.
    *R = *L ^ F(*R, k[dec ? 15 - i : i]); ## New R = L XOR F(R, key). Keys reversed to decrypt.
    *L = t; ## New L = old R.
  }
  t = *L; ## Final swap of the halves.
  *L = *R;
  *R = t;
}
int main()
{
  char text[9], keystr[9], out[9];
  unsigned int L, R, k[16];
  int i;
  printf("Enter 8 character plaintext : ");
  scanf("%8s", text);
  printf("Enter 8 character key : ");
  scanf("%8s", keystr);
  if (strlen(text) != 8 || strlen(keystr) != 8)
  {
    printf("Need exactly 8 characters\n");
    return 1;
  }
  for (i = 0; i < 16; i++)
    k[i] = keystr[i % 8] * (i + 1); ## Build the 16 subkeys.
  memcpy(&L, text, 4); ## Left half = first 4 bytes.
  memcpy(&R, text + 4, 4); ## Right half = last 4 bytes.
  crypt8(&L, &R, k, 0);
  printf("Ciphertext : %08x%08x\n", L, R);
  crypt8(&L, &R, k, 1);
  memcpy(out, &L, 4);
  memcpy(out + 4, &R, 4);
  out[8] = '\0';
  printf("Decrypted : %s\n", out);
  return 0;
}`,

code:String.raw`#include <stdio.h>
int power(int b, int e, int m) ## Returns b^e mod m.
{
  int r = 1, i;
  for (i = 0; i < e; i++)
    r = (r * b) % m;
  return r;
}
int inv(int a, int q) ## Modular inverse by trial.
{
  int i;
  for (i = 1; i < q; i++)
    if ((a * i) % q == 1)
      return i;
  return 0;
}
int main()
{
  int p = 283, q = 47, g = 60;
  int x, k, y, h = 0, r, s, w, u1, u2, v, i;
  char msg[100];
  printf("Enter message : ");
  scanf("%s", msg);
  printf("Enter private key x (1-46) : ");
  scanf("%d", &x);
  printf("Enter random k (1-46) : ");
  scanf("%d", &k);
  for (i = 0; msg[i] != '\0'; i++)
    h += msg[i]; ## Hash = sum of ASCII values.
  h = h % q;
  y = power(g, x, p); ## Public key.
  r = power(g, k, p) % q; ## First half of the signature.
  s = (inv(k, q) * (h + x * r)) % q; ## Second half, signed with x.
  printf("Signature : (%d,%d)\n", r, s);
  w = inv(s, q); ## Verification starts here.
  u1 = (h * w) % q;
  u2 = (r * w) % q;
  v = ((power(g, u1, p) * power(y, u2, p)) % p) % q; ## v is rebuilt using only the public key.
  if (v == r)
    printf("Signature verified: true\n");
  else
    printf("Signature verified: false\n");
  return 0;
}`,

code:String.raw`#include <stdio.h>
int main()
{
  FILE *in, *out;
  int p, i, j;
  char msg[9], ext[9];
  printf("Enter message (max 8 chars): ");
  scanf("%8s", msg);
  in = fopen("input.bmp", "rb");
  out = fopen("stego.bmp", "wb");
  if (!in || !out) ## Stop if a file could not be opened.
  {
    printf("File error!\n");
    return 1;
  }
  for (i = 0; i < 54; i++)
    fputc(fgetc(in), out); ## Copy the BMP header.
  for (i = 0; i < 8; i++) ## For every character…
  {
    for (j = 7; j >= 0; j--) ## …and every bit, left to right.
    {
      p = fgetc(in); ## Read one pixel byte.
      p = (p & 254) | ((msg[i] >> j) & 1); ## Replace its last bit with a message bit.
      fputc(p, out);
    }
  }
  while ((p = fgetc(in)) != EOF)
    fputc(p, out); ## Copy the rest of the image.
  fclose(in);
  fclose(out);
  in = fopen("stego.bmp", "rb");
  fseek(in, 54, SEEK_SET); ## Jump over the header.
  for (i = 0; i < 8; i++)
  {
    ext[i] = 0;
    for (j = 7; j >= 0; j--)
    {
      p = fgetc(in);
      ext[i] |= (p & 1) << j; ## Rebuild each character from last bits.
    }
  }
  ext[8] = '\0';
  fclose(in);
  printf("Stego image created: stego.bmp\n");
  printf("Extracted message: %s\n", ext);
  return 0;
}`,

`<p>The program keeps a running total called <code>hash</code> and starts it at <b>0</b>.</p><p>It then walks through the word one letter at a time. Every letter is secretly a number (its <b>ASCII code</b>), and that number is added to the total.</p><p>When it reaches the invisible end mark <code>'\\0'</code> it stops and prints the total.</p><p><b>Example:</b> Hello = 72 + 101 + 108 + 108 + 111 = <b>500</b></p><p><b>Flow:</b> read the word → set hash to 0 → loop and add → print → stop.</p>`,

`<p>RSA uses two keys. Anything locked with the public key can only be opened with the private key.</p><p>1. Read two primes <b>p</b> and <b>q</b>.<br>2. Multiply them: <b>n = p × q</b>, and compute <b>φ = (p-1)(q-1)</b>.<br>3. Find the public number <b>e</b>. It must share no common factor with φ (gcd = 1). Start trying from 7.<br>4. Find the private number <b>d</b> so that <code>(e × d) % φ = 1</code>.<br>5. Lock a message: <code>C = m^e mod n</code>. Unlock it: <code>M = C^d mod n</code>.</p><p><b>Example:</b> p = 11, q = 17 → n = 187, φ = 160, e = 7, d = 23. Message 88 → 11 → 88 again.</p>`,
`<p>Alice and Bob want the same secret number, but they can only talk in public.</p><p>They agree on a public prime <b>p</b> and a root <b>g</b>. Each keeps a private number: Alice has <b>a</b>, Bob has <b>b</b>.</p><p>Alice sends <code>A = g^a mod p</code>. Bob sends <code>B = g^b mod p</code>. These two travel in the open.</p><p>Alice mixes Bob's number with her private key: <code>S1 = B^a mod p</code>. Bob does <code>S2 = A^b mod p</code>. Maths makes both equal <code>g^(ab) mod p</code>.</p><p>If S1 == S2 the exchange worked.</p><p><b>Example:</b> p = 353, g = 3, a = 97, b = 233 → secret <b>160</b></p>`,
`<p>DES scrambles one 8-character block (64 bits) with an 8-character key.</p><p>First the key is turned into <b>16 subkeys</b>, one per round. The block is split into a left half <b>L</b> and a right half <b>R</b>.</p><p>In each of the 16 rounds: <code>new R = L XOR F(R, subkey)</code> and <code>new L = old R</code>. After the last round L and R are swapped, and that is the ciphertext (printed in hex).</p><p>To decrypt, run the <b>same rounds</b> with the subkeys in <b>reverse order</b>. That undoes the scrambling and gives the plaintext back.</p>`,
`<p>A signature proves who sent a message and that it was not changed.</p><p>The program uses small fixed numbers <b>p, q, g</b>, then reads the message, your private key <b>x</b> and a random <b>k</b>.</p><p>The message is squashed into a small number <code>h = (sum of ASCII) % q</code>. The public key is <code>y = g^x mod p</code>.</p><p><b>Signing</b> uses the private key to make the pair <b>(r, s)</b>.<br><b>Verifying</b> uses only public values to work out <code>v</code>.</p><p>If <code>v == r</code> the signature is genuine (true). Otherwise it is false.</p>`,
`<p>A BMP picture is a <b>54-byte header</b> followed by pixel bytes. Changing the last bit of a pixel byte changes the colour so little that nobody can see it, so we hide our message bits there.</p><p>The program reads up to 8 characters (8 × 8 = 64 bits), opens <code>input.bmp</code> and <code>stego.bmp</code>, and copies the header unchanged.</p><p>For each message bit it reads one pixel byte, clears the last bit with <code>p &amp; 254</code> and puts our bit in with <code>| bit</code>. The rest of the image is copied as it is.</p><p>To read the message back, it skips the header, collects the last bit of 64 bytes and joins them into 8 characters.</p>`
